name: eval-harness
on: [push, pull_request]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m eval_harness.cli run --config examples/support_tickets/config.json
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
